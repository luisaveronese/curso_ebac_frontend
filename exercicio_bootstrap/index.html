<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        h2 {
            padding-top: 50px;
            padding-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2>Cadastre-se</h2>
                <form class="needs-validation" novalidate id="form">
                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome:</label>
                        <input class="form-control" type="text" id="nome" required>
                        <div class="invalid-feedback">
                            Por favor, insira seu nome.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">E-mail:</label>
                        <input class="form-control" type="email" id="email" required>
                        <div class="invalid-feedback">
                            Por favor, insira seu e-mail.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="senha">Senha:</label>
                        <input class="form-control" type="password" id="senha" required>
                        <div class="invalid-feedback">
                            Por favor, insira sua senha.
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="aceitar-termos" required>
                        <label class="form-check-label" for="aceitar-termos">Li e aceito os termos</label>
                        <div class="invalid-feedback">
                            Por favor, aceite os termos.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success" id="mostrar-alerta">Enviar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
